<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNU Onam 2026</title>
    <style>
        body {
            background-color: #f0fff0; /* Very light green background */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
        }
        
        .onam-title {
            font-size: 4rem;
            font-weight: bold;
            color: black;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .date-location {
            font-size: 1.2rem;
            color: black;
            margin-bottom: 30px;
            line-height: 1.4;
        }

         .onasadaya-section {
            padding: 15px;
            background-color: rgba(144, 238, 144, 0.3); /* Light green background */
            border-radius: 8px;
            display: block;
        }
        
         .onasadaya-title {
            font-size: 2.8rem;
            font-weight: bold;
            color: #006400; /* Dark green color */
            line-height: 1.3;
        }
        
        .virtual-queue {
            font-size: 1.8rem;
            font-weight: bold;
            color: #991b1b; /* red color */
            line-height: 1.2;
            padding: 15px;
            background-color: rgba(144, 238, 144, 0.3); /* Light green background */
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="onam-title">JNU ONAM 2026</div>
        <div class="date-location">23<sup>rd</sup> November 2026<br>Sabarmati Lawn</div>
        <div class="onasadaya-section">
            <div class="onasadaya-title">Onasadhya</div>
            <div class="onasadaya-time"><strong>7 PM</strong> onwards</div>
            <div class="virtual-queue">
            <button style="
            background-color: rgba(126, 34, 206, 0.8); 
            color: white; 
            font-size: 18px; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;" 
                onclick="alert('Not live yet. Please check back on event day!');">
            Join Virtual Queue
            </button>
            <br>Virtual queue will be active on  23<sup>rd</sup> November.<br>Stay tuned!
            </div>
        </div>
        <div class="notice">
            <p><strong>A food coupon is mandatory for entry.</strong><br>Please collect yours in advance.</p>
        </div>
        <div class="footer"><p>See you there! 🌸</p></div>
    </div>
    
</body>
</html>
